<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgNexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101A"/>
      <stop offset="50%" stop-color="#030407"/>
      <stop offset="100%" stop-color="#061226"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#1558C9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgNexus)"/>
  
  <!-- Cyber Grid -->
  <g opacity="0.2" stroke="#1558C9" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Distributed Microservices Topology Nodes -->
  <g transform="translate(100, 60)">
    <!-- Central Cluster Hub -->
    <circle cx="300" cy="190" r="45" fill="#0E1626" stroke="#1558C9" stroke-width="3"/>
    <circle cx="300" cy="190" r="18" fill="#1558C9"/>
    <circle cx="300" cy="190" r="8" fill="#D4FF24"/>

    <!-- Satellites -->
    <line x1="300" y1="190" x2="160" y2="110" stroke="#1558C9" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="160" cy="110" r="28" fill="#0B101A" stroke="#00D9FF" stroke-width="2"/>
    <text x="160" y="114" fill="#00D9FF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">API</text>

    <line x1="300" y1="190" x2="440" y2="110" stroke="#1558C9" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="440" cy="110" r="28" fill="#0B101A" stroke="#00D9FF" stroke-width="2"/>
    <text x="440" y="114" fill="#00D9FF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AUTH</text>

    <line x1="300" y1="190" x2="160" y2="280" stroke="#1558C9" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="160" cy="280" r="28" fill="#0B101A" stroke="#D4FF24" stroke-width="2"/>
    <text x="160" y="284" fill="#D4FF24" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">KAFKA</text>

    <line x1="300" y1="190" x2="440" y2="280" stroke="#1558C9" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="440" cy="280" r="28" fill="#0B101A" stroke="#1558C9" stroke-width="2"/>
    <text x="440" y="284" fill="#F5F7FA" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">REDIS</text>
  </g>

  <!-- Top Metrics Bar -->
  <g transform="translate(40, 30)">
    <rect width="180" height="34" rx="6" fill="#0B101A" stroke="#1B2638"/>
    <circle cx="20" cy="17" r="4" fill="#D4FF24"/>
    <text x="32" y="22" fill="#D4FF24" font-family="monospace" font-size="11" font-weight="600">50,000+ REQ / SEC</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" fill="#F5F7FA" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">NEXUS CORE ENGINE</text>
    <text x="0" y="24" fill="#9299A6" font-family="'Inter', sans-serif" font-size="14">Distributed High-Throughput Microservices Cluster</text>
  </g>
</svg>
