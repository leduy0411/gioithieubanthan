<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgPay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030407"/>
      <stop offset="50%" stop-color="#07101E"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1558C9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgPay)"/>
  <circle cx="400" cy="220" r="180" fill="url(#shieldGlow)"/>

  <!-- Cryptographic Security Shield Graphic -->
  <g transform="translate(320, 110)">
    <path d="M80 0 L160 40 V120 C160 180 80 230 80 230 C80 230 0 180 0 120 V40 Z" fill="#0B101A" stroke="#1558C9" stroke-width="4"/>
    <path d="M80 20 L140 50 V115 C140 165 80 205 80 205 C80 205 20 165 20 115 V50 Z" fill="#060A12" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Lock Core -->
    <rect x="58" y="105" width="44" height="34" rx="6" fill="#1558C9"/>
    <path d="M66 105 V88 C66 78 72 72 80 72 C88 72 94 78 94 88 V105" stroke="#A99AFF" stroke-width="4" fill="none"/>
    <circle cx="80" cy="120" r="4" fill="#A99AFF"/>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(560, 40)">
    <rect width="200" height="70" rx="8" fill="#0B101A" stroke="#1B2638"/>
    <text x="20" y="30" fill="#9299A6" font-family="'Space Grotesk', sans-serif" font-size="11">SECURITY STANDARD</text>
    <text x="20" y="52" fill="#A99AFF" font-family="monospace" font-size="18" font-weight="700">AES-256 + RSA</text>
  </g>

  <!-- Title -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" fill="#F5F7FA" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">AURAPAY GATEWAY</text>
    <text x="0" y="24" fill="#9299A6" font-family="'Inter', sans-serif" font-size="14">Decentralized Payment Core &amp; Webhook Anti-Fraud System</text>
  </g>
</svg>
