<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#1558C9"/>
      <stop offset="100%" stop-color="#092863"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF24"/>
      <stop offset="100%" stop-color="#9BC700"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark space rounded background -->
  <rect width="100" height="100" rx="24" fill="#030407"/>
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="#1B2638" stroke-width="1.5"/>

  <!-- Futuristic Cyber "D" Polygon Path -->
  <!-- Vertical Spine -->
  <path d="M28 22H48C66 22 76 34 76 50C76 66 66 78 48 78H28C25.7909 78 24 76.2091 24 74V26C24 23.7909 25.7909 22 28 22Z" 
        stroke="url(#cyberBlue)" stroke-width="6" stroke-linejoin="round" fill="none"/>

  <!-- Inner Tech Cutout -->
  <path d="M38 34H48C58 34 64 41 64 50C64 59 58 66 48 66H38V34Z" 
        fill="#0B101A" stroke="#1558C9" stroke-width="2.5"/>

  <!-- Cyber Notch Lines -->
  <line x1="20" y1="50" x2="30" y2="50" stroke="#00D9FF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Neon Lime Energy Core -->
  <circle cx="50" cy="50" r="5" fill="url(#neonGlow)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>
</svg>