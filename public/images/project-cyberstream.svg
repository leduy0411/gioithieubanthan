<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1558C9"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#A99AFF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgStream)"/>
  
  <!-- Cyber Waves / Real-time data streams -->
  <path d="M0 250 C 150 120, 250 380, 400 250 C 550 120, 650 380, 800 250" fill="none" stroke="url(#waveGrad)" stroke-width="4"/>
  <path d="M0 270 C 150 160, 250 360, 400 270 C 550 160, 650 360, 800 270" fill="none" stroke="#1558C9" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M0 230 C 150 100, 250 400, 400 230 C 550 100, 650 400, 800 230" fill="none" stroke="#A99AFF" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>

  <!-- Bar Visualizer -->
  <g transform="translate(100, 320)" opacity="0.7">
    <rect x="0" y="40" width="12" height="60" fill="#1558C9" rx="2"/>
    <rect x="25" y="20" width="12" height="80" fill="#1558C9" rx="2"/>
    <rect x="50" y="0" width="12" height="100" fill="#00D9FF" rx="2"/>
    <rect x="75" y="15" width="12" height="85" fill="#A99AFF" rx="2"/>
    <rect x="100" y="35" width="12" height="65" fill="#1558C9" rx="2"/>
    <rect x="125" y="10" width="12" height="90" fill="#00D9FF" rx="2"/>
    <rect x="150" y="45" width="12" height="55" fill="#1558C9" rx="2"/>
  </g>

  <!-- Metrics HUD -->
  <g transform="translate(560, 40)">
    <rect width="200" height="70" rx="8" fill="#0B101A" stroke="#1B2638"/>
    <text x="20" y="30" fill="#9299A6" font-family="'Space Grotesk', sans-serif" font-size="11">STREAM INGESTION</text>
    <text x="20" y="52" fill="#A99AFF" font-family="monospace" font-size="18" font-weight="700">10M+ EVENTS/D</text>
  </g>

  <!-- Title -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" fill="#F5F7FA" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">CYBERSTREAM PIPELINE</text>
    <text x="0" y="24" fill="#9299A6" font-family="'Inter', sans-serif" font-size="14">Real-Time Event Processing &amp; Telemetry Architecture</text>
  </g>
</svg>
