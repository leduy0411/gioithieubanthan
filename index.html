  <!-- Failsafe suppression of any injected Netlify badge / drawer snippet -->
  <style>
    #netlify-badge,
    .netlify-badge,
    [data-netlify-badge],
    [class*="netlify-badge"],
    [id*="netlify-badge"],
    iframe[src*="netlify"],
    a[href*="netlify.com"],
    a[href*="netlify.app"],
    netlify-drawer,
    [data-netlify-drawer],
    div:has(> a[href*="netlify"]) {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      max-width: 0 !important;
      max-height: 0 !important;
      position: absolute !important;
      top: -99999px !important;
      left: -99999px !important;
      z-index: -999999 !important;
    }
  </style>
  <script>
    (function () {
      function purgeBadges() {
        var targets = document.querySelectorAll(
          '#netlify-badge, .netlify-badge, [data-netlify-badge], [class*="netlify-badge"], [id*="netlify-badge"], iframe[src*="netlify"], a[href*="netlify.com"], a[href*="netlify.app"], netlify-drawer, [data-netlify-drawer]'
        );
        targets.forEach(function (el) {
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', purgeBadges);
      } else {
        purgeBadges();
      }
      var obs = new MutationObserver(purgeBadges);
      obs.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
