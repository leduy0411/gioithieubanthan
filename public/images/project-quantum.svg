<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgQuantum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020305"/>
      <stop offset="50%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgQuantum)"/>

  <!-- 3D Isometric Sharding Vault Cubes -->
  <g transform="translate(300, 100)">
    <!-- Central Cube -->
    <polygon points="100,50 160,85 100,120 40,85" fill="#1558C9" stroke="#00D9FF" stroke-width="2"/>
    <polygon points="40,85 100,120 100,190 40,155" fill="#0C2556" stroke="#00D9FF" stroke-width="1.5"/>
    <polygon points="160,85 100,120 100,190 160,155" fill="#091A3E" stroke="#00D9FF" stroke-width="1.5"/>
    
    <!-- Orbiting Energy Core -->
    <circle cx="100" cy="85" r="14" fill="#A99AFF" filter="drop-shadow(0 0 10px #A99AFF)"/>

    <!-- Orbital Ring -->
    <ellipse cx="100" cy="120" rx="130" ry="45" fill="none" stroke="#1558C9" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="210" cy="130" r="8" fill="#00D9FF"/>
    <circle cx="-10" cy="110" r="6" fill="#A99AFF"/>
  </g>

  <!-- Title -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" fill="#F5F7FA" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">QUANTUM VAULT STORAGE</text>
    <text x="0" y="24" fill="#9299A6" font-family="'Inter', sans-serif" font-size="14">Zero-Knowledge Encrypted Sharding Storage API</text>
  </g>
</svg>
