<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040814"/>
      <stop offset="0.5" stop-color="#081026"/>
      <stop offset="1" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="neonCyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#1558C9"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Grid Matrix -->
  <g opacity="0.15">
    <path d="M0 75h1200M0 150h1200M0 225h1200M0 300h1200M0 375h1200M0 450h1200M0 525h1200M0 600h1200" stroke="#00D9FF" stroke-width="1"/>
    <path d="M150 0v675M300 0v675M450 0v675M600 0v675M750 0v675M900 0v675M1050 0v675" stroke="#00D9FF" stroke-width="1"/>
  </g>

  <!-- Server Cluster Nodes -->
  <!-- Central Distributed API Hub -->
  <g transform="translate(460, 160)">
    <rect width="280" height="350" rx="20" fill="#0B132B" stroke="#00D9FF" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="25" y="30" width="230" height="40" rx="8" fill="#1C2541" stroke="#00D9FF" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="6" fill="#00D9FF"/>
    <circle cx="70" cy="50" r="6" fill="#D4FF24"/>
    <rect x="95" y="46" width="140" height="8" rx="4" fill="#48E5C2" fill-opacity="0.5"/>

    <rect x="25" y="90" width="230" height="40" rx="8" fill="#1C2541" stroke="#00D9FF" stroke-width="1.2"/>
    <circle cx="50" cy="110" r="6" fill="#A855F7"/>
    <circle cx="70" cy="110" r="6" fill="#00D9FF"/>
    <rect x="95" y="106" width="120" height="8" rx="4" fill="#00D9FF" fill-opacity="0.5"/>

    <rect x="25" y="150" width="230" height="40" rx="8" fill="#1C2541" stroke="#00D9FF" stroke-width="1.2"/>
    <circle cx="50" cy="170" r="6" fill="#D4FF24"/>
    <circle cx="70" cy="170" r="6" fill="#00D9FF"/>
    <rect x="95" y="166" width="135" height="8" rx="4" fill="#D4FF24" fill-opacity="0.5"/>

    <rect x="25" y="210" width="230" height="100" rx="10" fill="#060A17" stroke="#1558C9" stroke-width="1.5"/>
    <text x="45" y="245" fill="#00D9FF" font-family="monospace" font-size="14" font-weight="bold">MICROSERVICE_NODE: 01</text>
    <text x="45" y="270" fill="#94A3B8" font-family="monospace" font-size="12">STATUS: 99.99% HEALTHY</text>
    <text x="45" y="292" fill="#D4FF24" font-family="monospace" font-size="12">LATENCY: 1.2ms (P99)</text>
  </g>

  <!-- Left Ingestion Gateway Node -->
  <g transform="translate(100, 220)">
    <rect width="240" height="230" rx="16" fill="#090E20" stroke="#A855F7" stroke-width="2" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="8" fill="#A855F7"/>
    <text x="60" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">AUTH &amp; INGESTION</text>
    <rect x="25" y="70" width="190" height="120" rx="8" fill="#050814"/>
    <path d="M45 130h150M45 105h120M45 155h90" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right Database Shard Node -->
  <g transform="translate(860, 220)">
    <rect width="240" height="230" rx="16" fill="#090E20" stroke="#D4FF24" stroke-width="2" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="8" fill="#D4FF24"/>
    <text x="60" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">POSTGRES + REDIS</text>
    <g transform="translate(50, 75)">
      <ellipse cx="70" cy="20" rx="60" ry="14" fill="#1C2541" stroke="#D4FF24" stroke-width="2"/>
      <ellipse cx="70" cy="55" rx="60" ry="14" fill="#1C2541" stroke="#D4FF24" stroke-width="2"/>
      <ellipse cx="70" cy="90" rx="60" ry="14" fill="#1C2541" stroke="#D4FF24" stroke-width="2"/>
    </g>
  </g>

  <!-- Connecting Glowing Data Pipelines -->
  <path d="M340 335H460" stroke="#00D9FF" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="400" cy="335" r="5" fill="#00D9FF"/>

  <path d="M740 335H860" stroke="#D4FF24" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="800" cy="335" r="5" fill="#D4FF24"/>
</svg>
