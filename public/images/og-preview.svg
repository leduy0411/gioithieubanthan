<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#030407"/>
  <circle cx="950" cy="315" r="380" fill="#1558C9" fill-opacity="0.25" filter="blur(60px)"/>
  <circle cx="200" cy="150" r="250" fill="#D4FF24" fill-opacity="0.08" filter="blur(80px)"/>

  <!-- Cyber Grid -->
  <g opacity="0.15" stroke="#1B2638" stroke-width="1.5">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Brand Content -->
  <g transform="translate(100, 180)">
    <rect width="170" height="36" rx="18" fill="#0B101A" stroke="#1558C9"/>
    <text x="24" y="23" fill="#D4FF24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DUY // PORTFOLIO</text>

    <text x="0" y="110" fill="#F5F7FA" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="800" letter-spacing="-1">
      BACKEND DEVELOPER
    </text>
    <text x="0" y="180" fill="#9299A6" font-family="'Inter', sans-serif" font-size="28" font-weight="400">
      Building scalable, efficient and intelligent digital experiences.
    </text>
    
    <g transform="translate(0, 240)">
      <rect width="240" height="54" rx="12" fill="#D4FF24"/>
      <text x="32" y="34" fill="#030407" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">EXPLORE WORK →</text>
    </g>
  </g>
</svg>
