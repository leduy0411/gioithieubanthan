<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="600" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050C1A"/>
      <stop offset="0.4" stop-color="#141E38"/>
      <stop offset="0.75" stop-color="#3D2645"/>
      <stop offset="1" stop-color="#D97736"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFDD80"/>
      <stop offset="1" stop-color="#FF5E36"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  <!-- Golden Hour Setting Sun -->
  <circle cx="600" cy="360" r="110" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="600" cy="360" r="160" fill="#FFB03A" opacity="0.2"/>

  <!-- Distant Misty Mountain Layers -->
  <path d="M0 430 Q 300 320, 600 380 T 1200 340 L 1200 675 L 0 675 Z" fill="#20152B" opacity="0.85"/>
  <path d="M0 480 Q 420 380, 850 460 T 1200 420 L 1200 675 L 0 675 Z" fill="#140E1E" opacity="0.95"/>
  <path d="M0 540 Q 250 480, 520 520 T 1200 490 L 1200 675 L 0 675 Z" fill="#09060E"/>

  <!-- Camera Viewfinder Crosshairs & Frame -->
  <g stroke="#00D9FF" stroke-width="2" opacity="0.65">
    <!-- Viewfinder Corners -->
    <path d="M80 120 V 80 H 120 M 1120 80 H 1080 V 120 M 80 555 V 595 H 120 M 1120 595 H 1080 V 555"/>
    <!-- Center Target Reticle -->
    <circle cx="600" cy="337" r="45" fill="none" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="600" cy="337" r="3" fill="#00D9FF"/>
    <line x1="530" y1="337" x2="575" y2="337"/>
    <line x1="625" y1="337" x2="670" y2="337"/>
    <line x1="600" y1="267" x2="600" y2="312"/>
    <line x1="600" y1="362" x2="600" y2="407"/>
  </g>

  <!-- Camera Telemetry HUD -->
  <rect x="80" y="605" width="1040" height="40" rx="8" fill="#050812" fill-opacity="0.8" stroke="#1E293B"/>
  <text x="110" y="630" fill="#00D9FF" font-family="monospace" font-size="13" font-weight="bold">1/1000s</text>
  <text x="220" y="630" fill="#D4FF24" font-family="monospace" font-size="13" font-weight="bold">f/1.8</text>
  <text x="310" y="630" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">ISO 100</text>
  <text x="420" y="630" fill="#A855F7" font-family="monospace" font-size="13" font-weight="bold">35mm PRIME</text>
  <text x="890" y="630" fill="#00D9FF" font-family="monospace" font-size="13" font-weight="bold">RAW [4K 60FPS]</text>
  <circle cx="1060" cy="625" r="5" fill="#EF4444"/>
</svg>

