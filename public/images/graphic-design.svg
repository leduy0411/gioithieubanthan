<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="studioBg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140826"/>
      <stop offset="0.5" stop-color="#0E051D"/>
      <stop offset="1" stop-color="#040209"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#studioBg)"/>
  
  <!-- Subtle Designer Canvas Grid -->
  <g opacity="0.12" stroke="#A855F7" stroke-width="1">
    <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200M0 300h1200M0 360h1200M0 420h1200M0 480h1200M0 540h1200M0 600h1200"/>
    <path d="M60 0v675M120 0v675M180 0v675M240 0v675M300 0v675M360 0v675M420 0v675M480 0v675M540 0v675M600 0v675M660 0v675M720 0v675M780 0v675M840 0v675M900 0v675M960 0v675M1020 0v675M1080 0v675M1140 0v675"/>
  </g>

  <!-- Big Central Vector Artwork Artboard -->
  <g transform="translate(240, 75)">
    <rect width="720" height="510" rx="20" fill="#0A0614" stroke="#A855F7" stroke-width="2.5"/>
    
    <!-- Top Window Toolbar -->
    <rect width="720" height="42" rx="20" fill="#170D2C"/>
    <circle cx="28" cy="21" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="21" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="21" r="6" fill="#27C93F"/>
    <text x="360" y="26" fill="#A855F7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">DUY_BRAND_IDENTITY_v4.ai [100% CMYK/RGB]</text>

    <!-- Vector Bézier Curves & Anchor Handles -->
    <path d="M120 380 C 220 120, 500 120, 600 380" stroke="url(#cyanGrad)" stroke-width="5" fill="none"/>
    <path d="M160 220 C 320 440, 480 80, 560 300" stroke="url(#penGrad)" stroke-width="4" stroke-dasharray="8 6" fill="none"/>

    <!-- Tangent Handle Lines & Anchors -->
    <line x1="220" y1="120" x2="160" y2="60" stroke="#00D9FF" stroke-width="2"/>
    <circle cx="160" cy="60" r="5" fill="#FFFFFF" stroke="#00D9FF" stroke-width="2"/>
    <rect x="214" y="114" width="12" height="12" fill="#00D9FF"/>

    <line x1="500" y1="120" x2="560" y2="60" stroke="#00D9FF" stroke-width="2"/>
    <circle cx="560" cy="60" r="5" fill="#FFFFFF" stroke="#00D9FF" stroke-width="2"/>
    <rect x="494" y="114" width="12" height="12" fill="#00D9FF"/>

    <!-- Central Glowing Geometric Diamond Monogram -->
    <g transform="translate(360, 260)">
      <polygon points="0,-70 60,0 0,70 -60,0" fill="#1C1038" stroke="#A855F7" stroke-width="3"/>
      <polygon points="0,-45 40,0 0,45 -40,0" fill="#00D9FF" fill-opacity="0.25" stroke="#00D9FF" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#D4FF24"/>
    </g>

    <!-- Color Swatches Palette Bar at Bottom -->
    <g transform="translate(210, 430)">
      <rect x="0" y="0" width="50" height="35" rx="6" fill="#00D9FF"/>
      <rect x="65" y="0" width="50" height="35" rx="6" fill="#1558C9"/>
      <rect x="130" y="0" width="50" height="35" rx="6" fill="#A855F7"/>
      <rect x="195" y="0" width="50" height="35" rx="6" fill="#EC4899"/>
      <rect x="260" y="0" width="50" height="35" rx="6" fill="#D4FF24"/>
    </g>
  </g>
</svg>

